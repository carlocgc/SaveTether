name: CI

on:
  push:
    branches: [development, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: savetether.exe
          - os: ubuntu-24.04
            rid: linux-x64
            exe: savetether
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            exe: savetether
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Restore
        run: dotnet restore SaveTether.slnx

      - name: Build
        run: dotnet build SaveTether.slnx -c Release --no-restore

      - name: Test
        run: dotnet test SaveTether.slnx -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish native binary
        run: dotnet publish src/SaveTether.Cli/SaveTether.Cli.csproj -c Release -r ${{ matrix.rid }} -o publish

      - name: Smoke test native binary
        shell: bash
        run: |
          out="$(./publish/${{ matrix.exe }} --version)"
          echo "$out"
          [[ "$out" =~ ^savetether\ [0-9]+\.[0-9]+\.[0-9]+ ]]
          # Reads and writes every file type, links and backs up, inside the native binary.
          ./publish/${{ matrix.exe }} --self-test

      - name: Two-device scenario with the native binary
        shell: bash
        run: bash tests/e2e/scenario1.sh "$PWD/publish/${{ matrix.exe }}"

      # Not run here: it needs a desktop session. Publishing it checks that Native AOT accepts it on each target.
      - name: Publish the desktop app
        run: dotnet publish src/SaveTether.Gui/SaveTether.Gui.csproj -c Release -r ${{ matrix.rid }} -o publish-gui

      # The same package the release workflow builds, checked file by file, so a missing library or a
      # stray file is found on the pull request rather than at release.
      - name: Package and check
        shell: bash
        run: |
          archive=$(bash build/package.sh ${{ matrix.rid }} savetether-ci-${{ matrix.rid }} publish publish-gui dist)
          bash build/check-package.sh ${{ matrix.rid }} "$archive"

      # Inno Setup builds the Windows installer (build/windows/savetether.iss). Build time only: nothing of it ships.
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      # The installer from the checked package, installed and uninstalled on this throwaway runner: files, Start menu,
      # Settings > Apps, the Path task, and that uninstalling leaves the user's Path as it was.
      - name: Build and check the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (& ./publish/${{ matrix.exe }} --version) -replace '^savetether ', ''
          $setup = ./build/build-installer.ps1 -Package dist/savetether-ci-${{ matrix.rid }}.zip -Version $version -OutDir dist | Select-Object -Last 1
          ./build/check-installer.ps1 -Installer $setup -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: savetether-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
