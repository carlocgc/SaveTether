name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: savetether.exe
          - os: ubuntu-24.04
            rid: linux-x64
            exe: savetether
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            exe: savetether
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Restore
        run: dotnet restore SaveTether.slnx

      - name: Build
        run: dotnet build SaveTether.slnx -c Release --no-restore

      - name: Test
        run: dotnet test SaveTether.slnx -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish native binary
        run: dotnet publish src/SaveTether.Cli/SaveTether.Cli.csproj -c Release -r ${{ matrix.rid }} -o publish

      - name: Smoke test native binary
        shell: bash
        run: |
          out="$(./publish/${{ matrix.exe }} --version)"
          echo "$out"
          [[ "$out" =~ ^savetether\ [0-9]+\.[0-9]+\.[0-9]+ ]]

      - uses: actions/upload-artifact@v4
        with:
          name: savetether-${{ matrix.rid }}
          path: |
            publish/${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 14
