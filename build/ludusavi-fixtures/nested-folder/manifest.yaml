Nested Game:
  files:
    "<winAppData>/NestedGame":
      tags: [save]
    "<winAppData>/NestedGame/Profiles/One":
      tags: [save]
    "<winAppData>/nestedgame/Profiles/Two":
      tags: [save]
    "<winAppData>/NestedGameOther":
      tags: [save]
    "<winAppData>/Other/Folder":
      tags: [save]
    "<winAppData>/Nested Stores":
      tags: [save]
      when:
        - os: windows
          store: gog
    "<winAppData>/Nested Stores/Steam":
      tags: [save]
      when:
        - os: windows
          store: steam
  steam:
    id: 777
